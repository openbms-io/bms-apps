# Alembic configuration for control-sequence-api-app

[alembic]
# path to migration scripts
script_location = %(here)s/migrations

# sys.path path, will be prepended to sys.path if present
prepend_sys_path = .

# Use os.pathsep for path separation
path_separator = os

# Database URL is configured from environment in migrations/env.py
# using src.config.settings

[post_write_hooks]
# Uncomment to format with black
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 88 REVISION_SCRIPT_FILENAME

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
